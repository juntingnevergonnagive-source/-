<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>塔羅 | 線上 AI 占卜</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- 載入帥氣的神秘字體：Cinzel Decorative (英文哥德神秘風) & Noto Serif TC (繁體中文經典明體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Noto+Serif+TC:wght@600;900&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    /* 自訂帥氣字體與文字特效 */
    .font-mystic-en {
      font-family: 'Cinzel Decorative', serif;
    }
    .font-serif-tc {
      font-family: 'Noto Serif TC', serif;
    }
    /* 文字金屬耀光效果 */
    .glow-text-gold {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6), 0 0 20px rgba(217, 119, 6, 0.4), 0 0 30px rgba(180, 83, 9, 0.3);
    }
    .glow-text-purple {
      text-shadow: 0 0 10px rgba(168, 85, 247, 0.6), 0 0 20px rgba(147, 51, 234, 0.4);
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between selection:bg-amber-500/30 selection:text-amber-200 relative overflow-x-hidden font-sans">

  <!-- 神祕動態星空 Canvas 背景 -->
  <canvas id="starfield" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <div class="relative z-10 container mx-auto px-4 py-8 max-w-5xl flex-grow">
    
    <!-- 頁頭與標題 -->
    <header class="text-center mb-10">
      <!-- 帥氣哥德字體英文次標題 -->
      <div class="font-mystic-en tracking-[0.3em] text-amber-400 text-sm sm:text-base mb-3 font-bold glow-text-gold uppercase flex items-center justify-center gap-3">
        <span>☾</span> ARCANE TAROT <span>✦</span>
      </div>
      <!-- 中文主標題 + 漸變鍍金發光字體 -->
      <h1 class="font-serif-tc text-5xl sm:text-7xl font-black bg-clip-text text-transparent bg-gradient-to-r from-amber-100 via-amber-300 to-amber-500 mb-4 tracking-wider glow-text-gold">
        塔羅
      </h1>
      <p class="font-serif-tc text-slate-300 text-sm sm:text-base max-w-md mx-auto font-semibold tracking-wide">
        靜心聆聽內心的聲音，讓塔羅為你揭開命運的篇章。
      </p>
    </header>

    <!-- API Key 設定區 (可折疊) -->
    <div class="mb-8 max-w-xl mx-auto">
      <details class="bg-slate-900/70 border border-amber-500/20 rounded-xl overflow-hidden backdrop-blur-md transition-all shadow-lg">
        <summary class="px-4 py-3 text-xs sm:text-sm text-slate-400 hover:text-amber-300 cursor-pointer flex justify-between items-center select-none font-serif-tc">
          <span><i class="fa-solid fa-key mr-2 text-amber-400"></i>設定自訂 Gemini API Key（選填，預設提供體驗）</span>
          <i class="fa-solid fa-chevron-down text-xs transition-transform"></i>
        </summary>
        <div class="p-4 border-t border-slate-800/80 bg-slate-950/60 space-y-2">
          <input type="password" id="apiKeyInput" placeholder="請貼上你的 Gemini API Key" 
            class="w-full bg-slate-900/90 border border-slate-700/80 rounded-lg px-3 py-2 text-sm text-amber-100 placeholder-slate-500 focus:outline-none focus:border-amber-500/80">
          <p class="text-[11px] text-slate-500">提示：留空則使用預設金鑰進行測試。可至 Google AI Studio 免費申請。</p>
        </div>
      </details>
    </div>

    <!-- 主要互動區域 -->
    <main class="space-y-8">
      
      <!-- 問題與牌陣選擇卡片 -->
      <section class="bg-slate-900/80 border border-amber-500/30 rounded-2xl p-5 sm:p-8 shadow-[0_0_30px_rgba(147,51,234,0.15)] backdrop-blur-md relative overflow-hidden space-y-6">
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -left-10 -top-10 w-40 h-40 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
        
        <div>
          <label for="userQuestion" class="block text-sm sm:text-base font-bold text-amber-200 mb-2.5 flex items-center gap-2 font-serif-tc">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> 請輸入你想要請教塔羅的問題：
          </label>
          <textarea id="userQuestion" rows="3" 
            placeholder="例如：我最近在考慮換工作，未來的職涯發展會順利嗎？或者是：我和目前這位的感情發展如何？"
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl p-3.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all text-sm sm:text-base resize-none"></textarea>
        </div>

        <!-- 牌陣選擇區 -->
        <div>
          <label class="block text-sm font-bold text-amber-200 mb-2.5 flex items-center gap-2 font-serif-tc">
            <i class="fa-solid fa-layer-group text-amber-400"></i> 請選擇占卜牌陣：
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <label class="spread-option cursor-pointer bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 flex items-start gap-3 hover:border-amber-500/50 transition-all">
              <input type="radio" name="spreadType" value="single" checked class="mt-1 accent-amber-400">
              <div>
                <div class="text-sm font-bold text-amber-100 font-serif-tc">單牌指引 (1張)</div>
                <div class="text-xs text-slate-400 mt-1">針對單一問題給予簡明、精確的直覺建議。</div>
              </div>
            </label>

            <label class="spread-option cursor-pointer bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 flex items-start gap-3 hover:border-amber-500/50 transition-all">
              <input type="radio" name="spreadType" value="timeline" class="mt-1 accent-amber-400">
              <div>
                <div class="text-sm font-bold text-amber-100 font-serif-tc">時間之流 (3張)</div>
                <div class="text-xs text-slate-400 mt-1">剖析問題的【過去脈絡】、【現在狀態】與【未來趨勢】。</div>
              </div>
            </label>

            <label class="spread-option cursor-pointer bg-slate-950/60 border border-slate-800 rounded-xl p-3.5 flex items-start gap-3 hover:border-amber-500/50 transition-all">
              <input type="radio" name="spreadType" value="choices" class="mt-1 accent-amber-400">
              <div>
                <div class="text-sm font-bold text-amber-100 font-serif-tc">二選一二元解析 (3張)</div>
                <div class="text-xs text-slate-400 mt-1">評估【選項 A】、【選項 B】以及給予【綜合智慧建議】。</div>
              </div>
            </label>
          </div>
        </div>
        
        <!-- 帥氣的按鈕樣式與字體 -->
        <div class="pt-3 flex justify-end">
          <button id="drawBtn" onclick="handleDrawCard()" 
            class="w-full sm:w-auto px-10 py-3.5 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-slate-950 font-black rounded-xl shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:shadow-[0_0_35px_rgba(245,158,11,0.7)] transition-all transform active:scale-95 flex items-center justify-center gap-2.5 cursor-pointer font-serif-tc tracking-widest text-lg">
            <i class="fa-solid fa-sparkles text-slate-950"></i>
            <span>揭開命運</span>
          </button>
        </div>
      </section>

      <!-- 抽牌展示與翻牌區域 -->
      <section id="cardDisplayArea" class="hidden flex flex-col items-center space-y-6 pt-4">
        <h2 class="text-slate-300 text-sm sm:text-base font-bold tracking-widest uppercase flex items-center gap-2 font-serif-tc glow-text-purple">
          <i class="fa-solid fa-eye text-purple-400"></i> 命運之牌已為你揭曉
        </h2>

        <!-- 卡牌展示容器 (動態渲染 1 張或 3 張) -->
        <div id="cardsContainer" class="flex flex-wrap justify-center gap-6 w-full">
          <!-- 卡牌 HTML 會由 JavaScript 自動動態生成 -->
        </div>

        <p class="text-xs text-slate-400 italic font-serif-tc">點擊卡牌可重複翻看牌面</p>
      </section>

      <!-- AI 解牌結果區域 -->
      <section id="resultArea" class="hidden bg-slate-900/90 border border-purple-500/40 rounded-2xl p-6 sm:p-8 shadow-[0_0_40px_rgba(168,85,247,0.15)] backdrop-blur-md space-y-6">
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
          <h2 class="text-xl sm:text-2xl font-serif-tc font-bold text-amber-300 flex items-center gap-2.5 glow-text-gold">
            <i class="fa-solid fa-brain text-purple-400"></i> AI 專屬個人解牌指引
          </h2>
          <span class="text-xs font-mystic-en text-purple-300/90 bg-purple-950/70 border border-purple-700/60 px-3 py-1 rounded-full tracking-wider">
            Gemini 3 Flash
          </span>
        </div>

        <!-- 載入中動畫 -->
        <div id="loadingSpinner" class="py-12 flex flex-col items-center justify-center space-y-4">
          <div class="relative w-12 h-12">
            <div class="absolute inset-0 border-4 border-purple-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-amber-400 rounded-full border-t-transparent animate-spin"></div>
          </div>
          <p class="text-sm text-slate-300 animate-pulse font-serif-tc">星光凝結中，AI 正在分析你的問題與牌陣...</p>
        </div>

        <!-- AI 解讀文章內容 -->
        <div id="aiReadingContent" class="hidden space-y-4 text-slate-200 leading-relaxed text-sm sm:text-base font-sans">
          <!-- 解讀文字動態渲染 -->
        </div>
      </section>

    </main>

    <!-- 頁尾 -->
    <footer class="mt-16 text-center text-xs text-slate-500 py-4 border-t border-slate-900 font-serif-tc">
      <p>© Arcane Tarot AI — 本解牌結果僅供參考娛樂與自我反思</p>
    </footer>
  </div>

  <!-- 背景動態星空腳本 -->
  <script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.015 + 0.005,
          color: Math.random() > 0.3 ? '#fff' : (Math.random() > 0.5 ? '#fde047' : '#c084fc')
        });
      }
    }

    function createShootingStar() {
      if (Math.random() < 0.02) {
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height / 2),
          length: Math.random() * 80 + 40,
          speed: Math.random() * 8 + 4,
          alpha: 1,
          angle: Math.PI / 4
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 3, 50,
        canvas.width / 2, canvas.height / 3, canvas.width * 0.8
      );
      gradient.addColorStop(0, 'rgba(30, 27, 75, 0.4)');
      gradient.addColorStop(0.5, 'rgba(15, 23, 42, 0.8)');
      gradient.addColorStop(1, 'rgba(3, 7, 18, 1)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) {
          star.speed = -star.speed;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha));
        ctx.fill();
      });

      createShootingStar();
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        s.alpha -= 0.015;

        if (s.alpha <= 0) {
          shootingStars.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        const tailX = s.x - Math.cos(s.angle) * s.length;
        const tailY = s.y - Math.sin(s.angle) * s.length;
        const lineGrad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
        lineGrad.addColorStop(0, `rgba(253, 224, 71, ${s.alpha})`);
        lineGrad.addColorStop(1, `rgba(253, 224, 71, 0)`);

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1.8;
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();
  </script>

  <script src="script.js"></script>
</body>
</html>
